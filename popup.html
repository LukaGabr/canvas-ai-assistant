<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 340px;
        padding: 16px;
        font-family: sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        padding: 6px;
        margin-bottom: 10px;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #apiKeyHint {
        font-size: 11px;
        color: #777;
        line-height: 1.3;
        margin: -4px 0 10px 0;
      }
      #settingsStatus {
        font-size: 12px;
        color: #c00;
        margin-top: 8px;
      }
      #status {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
      #answer {
        white-space: pre-wrap;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }
      .linkButton {
        width: auto;
        display: block;
        background: none;
        border: none;
        padding: 0;
        margin-top: 12px;
        font-size: 12px;
        color: #06c;
        text-decoration: underline;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Canvas AI Assistant</h1>

    <div id="settingsSection">
      <label for="apiKeyInput">Claude API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <p id="apiKeyHint">
        Your key is stored only on this device and sent only to Anthropic's API. Treat it like a
        password — anyone with access to your browser could technically access it.
      </p>
      <button id="saveKeyButton">Save</button>
      <div id="settingsStatus"></div>
    </div>

    <div id="mainSection">
      <label for="courseSelect">Course</label>
      <select id="courseSelect"></select>

      <label for="questionInput">Question</label>
      <textarea id="questionInput" placeholder="e.g. When is the next assignment due?"></textarea>

      <button id="askButton">Ask</button>

      <div id="status"></div>
      <div id="answer"></div>

      <button id="changeKeyButton" class="linkButton">Change API key</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
