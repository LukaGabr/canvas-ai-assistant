<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 340px;
        padding: 16px;
        font-family: sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        padding: 6px;
        margin-bottom: 10px;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #status {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
      #answer {
        white-space: pre-wrap;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Canvas AI Assistant</h1>

    <label for="courseSelect">Course</label>
    <select id="courseSelect"></select>

    <label for="questionInput">Question</label>
    <textarea id="questionInput" placeholder="e.g. When is the next assignment due?"></textarea>

    <button id="askButton">Ask</button>

    <div id="status"></div>
    <div id="answer"></div>

    <script src="popup.js"></script>
  </body>
</html>
