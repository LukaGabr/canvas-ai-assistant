<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 16px;
        font-family: sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px 0;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        padding: 6px;
        margin-bottom: 10px;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      #apiKeyHint {
        font-size: 11px;
        color: #777;
        line-height: 1.3;
        margin: -4px 0 10px 0;
      }
      #settingsStatus {
        font-size: 12px;
        color: #c00;
        margin-top: 8px;
      }
      #mainSection {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #messageList {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 10px 0;
        padding: 4px;
      }
      #emptyState {
        font-size: 12px;
        color: #888;
        text-align: center;
        margin-top: 20px;
      }
      .msg {
        max-width: 85%;
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg-user {
        align-self: flex-end;
        background: #daf0ff;
        color: #003a5c;
      }
      .msg-assistant {
        align-self: flex-start;
        background: #f0f0f0;
        color: #222;
      }
      #status {
        font-size: 12px;
        color: #555;
        min-height: 16px;
      }
      .linkButton {
        width: auto;
        display: inline-block;
        background: none;
        border: none;
        padding: 0;
        margin-top: 12px;
        margin-right: 12px;
        font-size: 12px;
        color: #06c;
        text-decoration: underline;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Canvas AI Assistant</h1>

    <div id="settingsSection">
      <label for="apiKeyInput">Claude API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <p id="apiKeyHint">
        Your key is stored only on this device and sent only to Anthropic's API. Treat it like a
        password — anyone with access to your browser could technically access it.
      </p>
      <button id="saveKeyButton">Save</button>
      <div id="settingsStatus"></div>
    </div>

    <div id="mainSection">
      <label for="courseSelect">Course</label>
      <select id="courseSelect"></select>

      <div id="messageList">
        <div id="emptyState">Ask a question about one of your courses to get started.</div>
      </div>

      <div id="status"></div>

      <label for="questionInput">Question</label>
      <textarea id="questionInput" placeholder="e.g. When is the next assignment due?"></textarea>

      <button id="askButton">Ask</button>

      <div>
        <button id="clearButton" class="linkButton">Clear conversation</button>
        <button id="changeKeyButton" class="linkButton">Change API key</button>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
